<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Light direction: every face lit from the same side, every shadow falling the same way</title>
  <defs>
    <linearGradient id="lit" x1="0" x2="1"><stop offset="0" stop-color="#e9dcc4"/><stop offset="1" stop-color="#8f7f66"/></linearGradient>
    <linearGradient id="wrong" x1="1" x2="0"><stop offset="0" stop-color="#e9dcc4"/><stop offset="1" stop-color="#8f7f66"/></linearGradient>
  </defs>
  <rect width="800" height="340" fill="#f4f1ea"/>
  <circle cx="60" cy="60" r="26" fill="#d9b44a"/><text x="96" y="66" fill="#2a2a26">light from the left</text>
  <line x1="0" y1="270" x2="800" y2="270" stroke="#2a2a26" stroke-width="1.5"/>
  <g><circle cx="200" cy="150" r="34" fill="url(#lit)"/><ellipse cx="250" cy="274" rx="60" ry="8" fill="#2a2a26" opacity=".25"/><rect x="180" y="186" width="40" height="84" rx="10" fill="url(#lit)"/></g>
  <g><circle cx="340" cy="150" r="34" fill="url(#lit)"/><ellipse cx="390" cy="274" rx="60" ry="8" fill="#2a2a26" opacity=".25"/><rect x="320" y="186" width="40" height="84" rx="10" fill="url(#lit)"/></g>
  <g><circle cx="480" cy="150" r="34" fill="url(#lit)"/><ellipse cx="530" cy="274" rx="60" ry="8" fill="#2a2a26" opacity=".25"/><rect x="460" y="186" width="40" height="84" rx="10" fill="url(#lit)"/></g>
  <g><circle cx="660" cy="150" r="34" fill="url(#wrong)"/><rect x="640" y="186" width="40" height="84" rx="10" fill="url(#wrong)"/></g>
  <text x="168" y="310" fill="#4f6238">matched: bright side left, shadows fall right</text>
  <text x="590" y="310" fill="#9a3b2a">pasted in: lit from the</text>
  <text x="590" y="328" fill="#9a3b2a">wrong side, no shadow</text>
</svg>
