<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Eye-level camera: the eyes of standing people sit on the horizon line</title>
  <rect width="800" height="420" fill="#f4f1ea"/>
  <rect y="210" width="800" height="210" fill="#e3dccd"/>
  <line x1="0" y1="150" x2="800" y2="150" stroke="#4f6238" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="16" y="140" fill="#4f6238">horizon line = camera height (eye level)</text>
  <!-- near person -->
  <g fill="#2a2a26"><circle cx="160" cy="132" r="22"/><rect x="132" y="158" width="56" height="150" rx="16"/><rect x="138" y="300" width="18" height="90"/><rect x="164" y="300" width="18" height="90"/></g>
  <circle cx="160" cy="150" r="3" fill="#f4f1ea"/>
  <!-- mid person -->
  <g fill="#2a2a26"><circle cx="380" cy="139" r="15"/><rect x="361" y="156" width="38" height="100" rx="11"/><rect x="365" y="250" width="12" height="60"/><rect x="383" y="250" width="12" height="60"/></g>
  <!-- far person -->
  <g fill="#2a2a26"><circle cx="560" cy="144" r="9"/><rect x="549" y="154" width="22" height="58" rx="6"/><rect x="551" y="208" width="7" height="36"/><rect x="562" y="208" width="7" height="36"/></g>
  <!-- added person (outline) -->
  <g fill="none" stroke="#4f6238" stroke-width="2.5"><circle cx="690" cy="137" r="18"/><rect x="667" y="158" width="46" height="122" rx="13"/><rect x="672" y="274" width="15" height="74"/><rect x="693" y="274" width="15" height="74"/></g>
  <text x="640" y="380" fill="#4f6238">added person: eyes on the line,</text>
  <text x="640" y="398" fill="#4f6238">feet on the ground where they stand</text>
  <text x="110" y="412" fill="#2a2a26">near: big</text>
  <text x="350" y="336" fill="#2a2a26">further: smaller</text>
  <text x="520" y="266" fill="#2a2a26">far: small</text>
</svg>
